server.port=8080

# PostgreSQL (start it with: docker compose up -d   from the project root)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origins allowed to call the API (React dev server by default)
portfolio.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
