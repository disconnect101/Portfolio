server.port=8080
server.address=${SERVER_ADDRESS:127.0.0.1}
server.forward-headers-strategy=framework

# PostgreSQL (start it with: docker compose up -d   from the project root)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/portfolio}
spring.datasource.username=${DB_USER:portfolio}
spring.datasource.password=${DB_PASSWORD:portfolio}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origins allowed to call the API (React dev server by default)
portfolio.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Used only to create the initial admin credential if the DB has no admin row.
# Once seeded, remove this variable; login compares against the DB hash only.
portfolio.admin.bootstrap-key=${ADMIN_BOOTSTRAP_KEY:}
portfolio.admin.session-minutes=${ADMIN_SESSION_MINUTES:30}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
